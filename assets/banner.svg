<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1441 302" width="1441" height="302" style="background:#262c36">
    <defs>
        <!-- Glow filters -->
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <filter id="meteorGlow">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Wave Gradients -->
        <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="50%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#f59e0b"/>
        </linearGradient>

        <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="50%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#f59e0b"/>
        </linearGradient>

        <!-- Meteor Trail Gradients -->
        <linearGradient id="trail-1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#61DAFB" stop-opacity="0"/>
            <stop offset="100%" stop-color="#61DAFB" stop-opacity="1"/>
        </linearGradient>
        <linearGradient id="trail-2" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3178C6" stop-opacity="0"/>
            <stop offset="100%" stop-color="#3178C6" stop-opacity="1"/>
        </linearGradient>
        <linearGradient id="trail-3" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#F7DF1E" stop-opacity="0"/>
            <stop offset="100%" stop-color="#F7DF1E" stop-opacity="1"/>
        </linearGradient>
        <linearGradient id="trail-4" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#339933" stop-opacity="0"/>
            <stop offset="100%" stop-color="#339933" stop-opacity="1"/>
        </linearGradient>
        <linearGradient id="trail-5" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/>
            <stop offset="100%" stop-color="#06B6D4" stop-opacity="1"/>
        </linearGradient>
        <linearGradient id="trail-6" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#E34F26" stop-opacity="0"/>
            <stop offset="100%" stop-color="#E34F26" stop-opacity="1"/>
        </linearGradient>
        <linearGradient id="trail-7" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#927be5" stop-opacity="0"/>
            <stop offset="100%" stop-color="#927be5" stop-opacity="1"/>
        </linearGradient>
    </defs>

    <!-- Animated Sine Waves -->
    <path d="M0 151 Q180 121 360 151 T721 151 T1081 151 T1441 151"
          fill="none"
          stroke="url(#waveGrad)"
          stroke-width="2.5"
          opacity="0.6">
        <animate attributeName="d"
                 dur="6s"
                 repeatCount="indefinite"
                 values="
             M0 151 Q180 121 360 151 T721 151 T1081 151 T1441 151;
             M0 151 Q180 181 360 151 T721 151 T1081 151 T1441 151;
             M0 151 Q180 121 360 151 T721 151 T1081 151 T1441 151"/>
    </path>

    <path d="M0 151 Q180 181 360 151 T721 151 T1081 151 T1441 151"
          fill="none"
          stroke="url(#waveGrad)"
          stroke-width="1.5"
          opacity="0.3">
        <animate attributeName="d"
                 dur="8s"
                 repeatCount="indefinite"
                 values="
             M0 151 Q180 181 360 151 T721 151 T1081 151 T1441 151;
             M0 151 Q180 121 360 151 T721 151 T1081 151 T1441 151;
             M0 151 Q180 181 360 151 T721 151 T1081 151 T1441 151"/>
    </path>

    <!-- Flying Meteor Particles -->
    <g filter="url(#meteorGlow)">
        <line x1="100" y1="-50" x2="113" y2="-1" stroke="url(#trail-1)" stroke-width="2.5" stroke-linecap="round">
            <animate attributeName="x1" values="100;400" dur="4s" repeatCount="indefinite" begin="0s"/>
            <animate attributeName="y1" values="-50;350" dur="4s" repeatCount="indefinite" begin="0s"/>
            <animate attributeName="x2" values="113;413" dur="4s" repeatCount="indefinite" begin="0s"/>
            <animate attributeName="y2" values="-1;399" dur="4s" repeatCount="indefinite" begin="0s"/>
        </line>
        <line x1="300" y1="-50" x2="313" y2="-1" stroke="url(#trail-2)" stroke-width="2.5" stroke-linecap="round">
            <animate attributeName="x1" values="300;600" dur="5s" repeatCount="indefinite" begin="1s"/>
            <animate attributeName="y1" values="-50;350" dur="5s" repeatCount="indefinite" begin="1s"/>
            <animate attributeName="x2" values="313;613" dur="5s" repeatCount="indefinite" begin="1s"/>
            <animate attributeName="y2" values="-1;399" dur="5s" repeatCount="indefinite" begin="1s"/>
        </line>
        <line x1="500" y1="-50" x2="513" y2="-1" stroke="url(#trail-3)" stroke-width="2.5" stroke-linecap="round">
            <animate attributeName="x1" values="500;800" dur="4.5s" repeatCount="indefinite" begin="2s"/>
            <animate attributeName="y1" values="-50;350" dur="4.5s" repeatCount="indefinite" begin="2s"/>
            <animate attributeName="x2" values="513;813" dur="4.5s" repeatCount="indefinite" begin="2s"/>
            <animate attributeName="y2" values="-1;399" dur="4.5s" repeatCount="indefinite" begin="2s"/>
        </line>
        <line x1="800" y1="-50" x2="813" y2="-1" stroke="url(#trail-4)" stroke-width="2.5" stroke-linecap="round">
            <animate attributeName="x1" values="800;1100" dur="5s" repeatCount="indefinite" begin="0.5s"/>
            <animate attributeName="y1" values="-50;350" dur="5s" repeatCount="indefinite" begin="0.5s"/>
            <animate attributeName="x2" values="813;1113" dur="5s" repeatCount="indefinite" begin="0.5s"/>
            <animate attributeName="y2" values="-1;399" dur="5s" repeatCount="indefinite" begin="0.5s"/>
        </line>
        <line x1="1050" y1="-50" x2="1063" y2="-1" stroke="url(#trail-5)" stroke-width="2.5" stroke-linecap="round">
            <animate attributeName="x1" values="1050;1350" dur="4.2s" repeatCount="indefinite" begin="1.5s"/>
            <animate attributeName="y1" values="-50;350" dur="4.2s" repeatCount="indefinite" begin="1.5s"/>
            <animate attributeName="x2" values="1063;1363" dur="4.2s" repeatCount="indefinite" begin="1.5s"/>
            <animate attributeName="y2" values="-1;399" dur="4.2s" repeatCount="indefinite" begin="1.5s"/>
        </line>
        <line x1="1250" y1="-50" x2="1263" y2="-1" stroke="url(#trail-6)" stroke-width="2.5" stroke-linecap="round">
            <animate attributeName="x1" values="1250;1550" dur="4.8s" repeatCount="indefinite" begin="2.5s"/>
            <animate attributeName="y1" values="-50;350" dur="4.8s" repeatCount="indefinite" begin="2.5s"/>
            <animate attributeName="x2" values="1263;1563" dur="4.8s" repeatCount="indefinite" begin="2.5s"/>
            <animate attributeName="y2" values="-1;399" dur="4.8s" repeatCount="indefinite" begin="2.5s"/>
        </line>
    </g>

    <!-- Central Cyber Rings -->
    <g>
        <circle cx="720.5" cy="151" r="56" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.6">
            <animateTransform attributeName="transform" type="rotate" from="0 720.5 151" to="360 720.5 151" dur="20s" repeatCount="indefinite" />
        </circle>
        <circle cx="720.5" cy="151" r="50" fill="none" stroke="url(#glowGrad)" stroke-width="3" filter="url(#glow)"/>
        <circle cx="720.5" cy="151" r="45" fill="#1e232a"/>
    </g>
</svg>