name: Generate Snake

on:
  schedule:
    # Chạy tự động lúc 00:00 UTC mỗi ngày
    - cron: "0 0 * * *"
  
  # Cho phép chạy thủ công bất kỳ lúc nào từ tab Actions
  workflow_dispatch:
  
  # Chạy mỗi khi có commit mới đẩy lên nhánh main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Tạo animation snake từ contribution graph
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Đẩy file svg vừa tạo lên nhánh output
      - name: Push github-contribution-grid-snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
