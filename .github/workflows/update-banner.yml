name: Generate Profile Banner

on:
  push:
    paths:
      - 'banner-config.json'
      - 'scripts/generate-banner.js'
      - 'assets/avatar.png'
  workflow_dispatch:

jobs:
  build-banner:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generate Banner
        run: node scripts/generate-banner.js

      - name: Commit and Push Updated Banner
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/main-banner.svg
          git status
          git diff --staged --quiet || (git commit -m "auto: update animated profile banner" && git pull --rebase origin main && git push)
